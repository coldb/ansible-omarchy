- name: Desktop - Hyprland
  tags:
    - install
    - install-hyprland
    - update
    - update-hyprland

  block:
    - name: Ensure hypr-local config directory exists
      file:
        path: "{{ home_dir }}/.config/hypr-local"
        state: directory
        mode: "0755"

    - name: Stow hyprland local overlay files
      stow:
        folders: [hypr]
        target: "{{ home_dir }}"
        dotfiles_dir: "{{ dotfiles_dir }}"

    - name: Load local overlays from Omarchy Lua configs
      lineinfile:
        path: "{{ home_dir }}/.config/hypr/{{ item }}.lua"
        line: >-
          dofile((os.getenv("HOME") or "") .. "/.config/hypr-local/{{ item }}.lua")
        insertafter: EOF
        state: present
      loop:
        - autostart
        - bindings
        - hyprland
        - input
        - looknfeel

    - name: Check for legacy Hyprland configs
      stat:
        path: "{{ home_dir }}/.config/hypr/{{ item }}.conf"
      loop:
        - autostart
        - bindings
        - hyprland
        - input
        - looknfeel
      register: hyprland_legacy_configs

    - name: Remove legacy Hyprland config loader lines
      lineinfile:
        path: "{{ item.stat.path }}"
        line: "source = ~/.config/hypr-local/{{ item.item }}.conf"
        state: absent
      loop: "{{ hyprland_legacy_configs.results }}"
      when: item.stat.exists

    - name: Remove stale local Hyprland config links
      file:
        path: "{{ home_dir }}/.config/hypr-local/{{ item }}.conf"
        state: absent
      loop:
        - autostart
        - bindings
        - hypridle
        - hyprland
        - input
        - looknfeel
        - small-screen-scaling

    - name: Reload hyprland config
      command: hyprctl reload
      changed_when: false
      when: hyprland_session_active

    - name: Validate hyprland config
      command: hyprctl configerrors
      register: hyprland_config_errors
      changed_when: false
      failed_when: hyprland_config_errors.stdout | trim | length > 0
      when: hyprland_session_active

- name: Desktop - Hyprland small screen scaling
  tags:
    - laptop-scaling

  block:
    - name: Stow hyprland small screen scaling file
      stow:
        folders: [hypr]
        target: "{{ home_dir }}"
        dotfiles_dir: "{{ dotfiles_dir }}"

    - name: Load small screen scaling from Omarchy monitor config
      lineinfile:
        path: "{{ home_dir }}/.config/hypr/monitors.lua"
        line: >-
          dofile((os.getenv("HOME") or "") .. "/.config/hypr-local/small-screen-scaling.lua")
        insertafter: EOF
        state: present

    - name: Reload hyprland config
      command: hyprctl reload
      changed_when: false
      when: hyprland_session_active

    - name: Validate hyprland config
      command: hyprctl configerrors
      register: hyprland_scaling_config_errors
      changed_when: false
      failed_when: hyprland_scaling_config_errors.stdout | trim | length > 0
      when: hyprland_session_active
